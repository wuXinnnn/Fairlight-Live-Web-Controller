name: Desktop

# Separate from ci.yml on purpose. ci.yml runs on ubuntu-latest and installs none of the
# system libraries Tauri needs, so `@flwc/desktop`'s root scripts cover the window frontend
# only. Everything cargo touches lives here.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    # One entry today. Adding macOS or Linux later is a matter of appending to this list and
    # filling in the matching row of the triple table in scripts/fetch-node.mjs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: src-tauri/target/release/bundle/nsis/*.exe
            artifact: flwc-launcher-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # For the release a tag build attaches its installer to.
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The runner ships a rustup toolchain; there is nothing to install.
      - name: Rust toolchain
        run: |
          rustup show
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build the workspace
        run: pnpm build
        working-directory: .

      # Before cargo, not after: build.rs copies externalBin and bundle.resources into the
      # target directory and fails outright when they are missing, so clippy and test would
      # not even get as far as compiling.
      - name: Fetch the Node runtime and stage the server
        run: node scripts/prepare.mjs --target ${{ matrix.target }}

      - name: Smoke test the staged server
        run: node scripts/smoke-staged-server.mjs

      - name: Format
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Test
        run: cargo test
        working-directory: apps/desktop/src-tauri

      - name: Bundle the installer
        run: pnpm tauri build

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/${{ matrix.bundle }}
          if-no-files-found: error

      # A tag has to name the version the bundle actually carries, or the release would offer
      # an installer that calls itself something else.
      - name: Check the tag against tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          configured=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$configured" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not match tauri.conf.json version $configured" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $configured"

      # view || create, the same way docker.yml does it: both workflows attach to this one
      # release and whichever runs first has to be the one that creates it.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.bundle }} --clobber

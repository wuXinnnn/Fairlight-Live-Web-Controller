name: Soak

on:
  # Temporary, to prove the runner can do this before the workflow reaches the default branch.
  # Removed in the commit that follows.
  push:
    paths:
      - '.github/workflows/soak.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Run length in minutes'
        default: '60'
        required: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # No `--` before the flags: pnpm swallows the first one when it is there.
      # `--no-sandbox` is needed because the runner already runs as root.
      - name: Soak
        run: >
          pnpm --filter @flwc/server run soak
          --minutes ${{ inputs.minutes || '3' }}
          --browser "$CHROME_BIN"
          --browser-args "--no-sandbox"
          --out soak-reports/ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: soak-reports/ci
          retention-days: 30

services:
  flwc:
    image: ghcr.io/wuxinnnn/fairlight-live-web-controller:latest
    # build: .   # uncomment to build from this checkout instead of pulling
    container_name: flwc
    ports:
      # host:container. Change the left side to serve on another host port; the right side
      # has to match PORT below.
      - '3000:3000'
    environment:
      # Where Fairlight Live is. Seed values: written to config.json on the very first start
      # only, when there is no file yet. After that the file (and the CONNECTION panel in the UI)
      # wins, however these are set.
      EMBER_HOST: 192.168.1.10 # the machine running Fairlight Live
      EMBER_PORT: '9000' # the Ember+ port set in Fairlight Live's Show settings

      # Everything below is optional. The image already sets HOST and PORT; the rest fall back
      # to their defaults inside the container.

      # The address the web server binds inside the container. Leave it on 0.0.0.0, or the
      # published port above stops answering.
      # HOST: 0.0.0.0

      # The port the web server binds inside the container. If you change it, change the right
      # side of the port mapping above to match; the health check follows it automatically.
      # PORT: '3000'

      # Where config.json is kept. /app/data is what the volume below mounts, so change both
      # or neither.
      # FLWC_DATA_DIR: /app/data

      # Where the web build is served from. The image ships it at the default; there is no
      # reason to change this in a container.
      # FLWC_WEB_ROOT: /app/apps/web/dist

      # Exit when stdin closes. For process supervisors and the desktop launcher; Docker stops
      # the container with a signal instead, so leave it unset here.
      # FLWC_EXIT_ON_STDIN_CLOSE: '1'

      # How often (ms) a short-lived probe connection asks the desk for channels it added without
      # telling us. Every probe is a new connection the desk must admit, and several backends
      # share that budget, so keep it in minutes. '0' turns the probe off.
      # FLWC_EMBER_PROBE_INTERVAL_MS: '60000'

      # How long (ms) to wait for the desk to describe one channel while the tree is read. Raise
      # it if channels are missing from the mixer page after connecting to a busy desk.
      # FLWC_EMBER_STRIP_TIMEOUT_MS: '2000'
    volumes:
      - flwc-data:/app/data
    restart: unless-stopped
volumes:
  flwc-data:
